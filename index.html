Archiving yet another part of my life that I cannot keep inside me anymore. It has taken up too much of me.

I wanted to archive the part of my life when I did not want to live.

One step. Then another.

Years ago, in high school, I wrote "Per aspera ad astra" in the corner of my textbook. Through hardships to the stars.

Somehow, I am still here.

A trace. Evidence of the days when I did not want to be here, and the fact that I am here anyway.

So, 

Hello. I'm Anna. 
Or at least, this is a part of me. A digital fragment.

Perhaps, if you enter this space, you will recognize something there. A little shard you never noticed falling.

Be gentle with it. It is still me.`;
 
const PRO=`These here, are pieces of me, written during the worst period of my life.

For some context, I have always been a depressed girl.

The sad girl.

The girl who cries when her favourite show ends, when a friend gives her her favourite Sharpie so she can finish her drawing, when something beautiful comes to an end and she wasn't ready for it to.

Depression has met me several times throughout my life. And every time, She took something with her.
Pieces of me that I never found again.
But somehow, I always found other ways to live without them.

This time, though, was different.

My whole soul was crushed. Disappeared even.

You know that feeling when you break something you promised yourself you wouldn't break? 
That vase you've had for years, perhaps.
And suddenly you're on the floor, desperately trying to save it. Picking up the pieces. Counting them. Trying to fit one against another, because surely, surely, if you're careful enough, if you take your time, you can put it back together.

And maybe you can.

Mostly.

But then you notice them.

The microscopic shards.

The pieces so small that you didn't even notice them breaking away.
No matter how good a bricoleur you are, there is no way to glue those back together.
And before you even have the chance to reach for them, the breeze coming through your window catches them and carries them away.
Into the deepest corners of your furniture.
Under your bed.
Between the cracks in the floor.
Places you'll probably never look.
Places you will never know how to reach.

See?

This was like that.
Little shards.
Dust, even.

Pieces of me falling away while I stood there and watched myself break apart.

Watched myself become less and less.
And I couldn't do anything about it.

And this?

Because of one person.
One person out of eight billion.

Her.`;
