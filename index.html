const order=cells.map((c,i)=>i).sort((a,b)=>area(cells[a])-area(cells[b]));
const frs=FR.map((t,i)=>i).sort((a,b)=>FR[a].length-FR[b].length);
for(let i=1;i<N;i++) if(r()<.3){ const t=frs[i]; frs[i]=frs[i-1]; frs[i-1]=t; }
const textFor=[]; order.forEach((ci,k)=>textFor[ci]=FR[frs[k]]);

const mesh=document.getElementById('mesh'), ov=document.getElementById('ov'), card=document.getElementById('card'), frag=document.getElementById('frag'), sp=document.getElementById('sp');
const starKeys=new Set(); let seenCount=0, sawShown=false;
function addStars(poly){ poly.forEach((p,k)=>{ const key=p.join(); if(starKeys.has(key)) return; starKeys.add(key);
  const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r',2.4); c.setAttribute('class','star'); mesh.appendChild(c); setTimeout(()=>c.style.opacity=1,150+k*130); }); }
function shape(seed){ const q=rng(seed), R=(a,b)=>a+q()*(b-a);
  const P=[[R(0,6),R(4,14)],[R(8,20),0],[R(40,60),R(0,3)],[R(78,92),0],[100,R(6,16)],[R(96,100),R(40,60)],[100,R(84,94)],[R(80,92),100],[R(44,60),R(97,100)],[R(10,22),100],[0,R(86,96)],[R(0,3),R(40,60)]];
  return P.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '); }

cells.forEach((poly,i)=>{
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','sh');
  const p=document.createElementNS(NS,'polygon'); p.setAttribute('points',jag(poly).map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ')); g.appendChild(p);
  g.addEventListener('click',()=>open(i,g,poly)); mesh.appendChild(g);
});

function open(i,g,poly){
  const text=textFor[i], len=text.length;
  sp.setAttribute('points',shape('k'+i));
  frag.style.fontSize = len<16 ? 'clamp(2.6rem,6vw,4rem)' : len<90 ? 'clamp(1.9rem,3.4vw,2.6rem)' : 'clamp(1.5rem,2.5vw,2rem)';
  card.style.minHeight = len<16 ? '26vh' : len<90 ? '32vh' : '40vh';
  frag.classList.remove('lit'); frag.innerHTML='';
  text.split('\n').forEach((l,k)=>{ const d=document.createElement('span'); d.className='ln'; d.textContent=l===''?'\u00a0':l; d.style.transitionDelay=(0.5+k*0.2)+'s'; frag.appendChild(d); });
  frag.scrollTop=0;
  const b=g.getBoundingClientRect();
  card.style.setProperty('--fx',(b.left+b.width/2-innerWidth/2)+'px'); card.style.setProperty('--fy',(b.top+b.height/2-innerHeight/2)+'px');
  ov.classList.add('open'); requestAnimationFrame(()=>requestAnimationFrame(()=>frag.classList.add('lit')));
  if(!g.classList.contains('seen')){ g.classList.add('seen'); addStars(poly); seenCount++;
    if(seenCount>=40&&!sawShown){ sawShown=true; const s=document.getElementById('saw'); setTimeout(()=>s.classList.add('on'),2500); setTimeout(()=>s.classList.remove('on'),9000); } }
}
const close=()=>ov.classList.remove('open');
document.getElementById('x').addEventListener('click',close);
ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
</script>
</body>
</html>
