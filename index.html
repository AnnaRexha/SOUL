<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHARDS</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap" rel="stylesheet" />

   <style>

.shard-avatar.final-call {
  animation: shardAvatarFinal 3.2s ease-in-out infinite;
}

@keyframes shardAvatarFinal {
  0%, 100% {
    opacity: 0.8;
    transform: scale(1);
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
  }
  50% {
    opacity: 1;
    transform: scale(2.4);
    filter: drop-shadow(0 0 22px rgba(255, 255, 255, 1));
  }
}

      /* Larger text for a wall-sized screen */
.modal-card { max-width: min(900px, 90vw); max-height: 85vh; }
.modal-title { font-size: clamp(2rem, 3.2vw, 3rem); }
.modal-body { font-size: clamp(1.15rem, 1.6vw, 1.6rem); line-height: 1.9; }
.modal-tag { font-size: 0.9rem; }
.modal-close { font-size: 1.8rem; padding: 0.6rem 1rem; top: 1rem; right: 1rem; }
.reading-screen { max-width: 820px; }
.reading-body { font-size: clamp(1.1rem, 1.5vw, 1.5rem); }

/* The dot: easier to tap, and it calls out once visitors have read a few shards */
.shard-avatar::after { content: ''; position: absolute; inset: -18px; }

.shard-avatar.calling:not(.all-witnessed) {
  animation: shardAvatarDrift 9s ease-in-out infinite,
    shardAvatarCall 2.8s ease-in-out infinite;
}

@keyframes shardAvatarCall {
  0%, 100% { opacity: 0.6; transform: scale(1);   filter: drop-shadow(0 0 6px var(--star-glow)); }
  50%      { opacity: 1;   transform: scale(1.9); filter: drop-shadow(0 0 16px var(--star-glow)); }
}

      :root {
        --bg: #050508;
        --glass-line: rgba(255, 255, 255, 0.38);
        --glass-glow: rgba(255, 255, 255, 0.09);
        --text-main: #f1f5f9;
        --text-dim: #94a3b8;
        --star-color: #f59e0b;
        --star-glow: rgba(245, 158, 11, 0.85);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        min-height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
      }

      /* ================================
       INTRO OVERLAY (SOUL -> DUST -> cracks)
       Sits on top of everything else at z-index 50.
       Fades itself out at the end to reveal the
       constellation, which has been rendering
       underneath, untouched, the whole time.
    ================================ */

      .intro-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 2.2s ease;
      }

      .intro-overlay.intro-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .intro-overlay.intro-faded {
        /* only the reading screens fade — the crack svg and dot
         are pulled out of this fade separately, see below */
        pointer-events: none;
      }

      .reading-screen {
        position: relative;
        max-width: 640px;
        padding: 2.5rem;
        text-align: center;
        opacity: 1;
        transition: opacity 1.6s ease;
      }

      .reading-screen.reading-hidden {
        opacity: 0;
        pointer-events: none;
        position: absolute;
      }

      .reading-title {
        font-family: Georgia, serif;
        font-size: clamp(1.8rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        color: rgba(241, 245, 249, 0.9);
        cursor: pointer;
        background: transparent;
        border: 0;
        padding: 1rem;
        transition: opacity 0.4s ease, letter-spacing 0.4s ease;
      }

      .reading-title:hover {
        opacity: 0.65;
        letter-spacing: 0.5em;
      }

      .reading-body {
        font-family: Georgia, serif;
        line-height: 1.9;
        font-size: 1.05rem;
        color: rgba(203, 213, 225, 0.92);
        white-space: pre-line;
        max-height: 62vh;
        overflow-y: auto;
        margin-bottom: 2rem;
        padding: 0 0.5rem;
      }

      .enter-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: var(--text-dim);
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        padding: 0.6rem 1.6rem;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.3s ease;
        opacity: 0;
        }

      .enter-btn:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.6);
      }

      @keyframes enterFadeIn {
        to {
          opacity: 1;
        }
      }

      /* The real artwork stays invisible and unclickable until
       the constellation shatters into view. */
      .reveal-target {
        opacity: 0;
        transition: opacity 2s ease;
      }

      .reveal-target.revealed {
        opacity: 1;
      }

      .shard-avatar {
        position: fixed;
        bottom: 2.5rem;
        left: 2.5rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 0;
        background: var(--star-color);
        cursor: pointer;
        z-index: 15;
        filter: drop-shadow(0 0 6px var(--star-glow));
        animation: shardAvatarDrift 9s ease-in-out infinite,
          shardAvatarPulse 4.5s ease-in-out infinite;
        transition: background 2s ease, filter 2s ease;
      }

      .shard-avatar.all-witnessed {
        background: #f8fafc;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        animation: shardAvatarDrift 9s ease-in-out infinite;
      }

      @keyframes shardAvatarDrift {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(6px, -8px);
        }
      }

      @keyframes shardAvatarPulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      .witness-message {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, serif;
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        letter-spacing: 0.15em;
        color: rgba(241, 245, 249, 0.75);
        opacity: 0;
        pointer-events: none;
        transition: opacity 3s ease;
      }

      .witness-message.visible {
        opacity: 1;
      }

      /* ================================
       EXISTING ARTWORK (unchanged below)
    ================================ */

      #dust-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        padding: 2rem 3rem;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 1.4rem;
        pointer-events: none;
      }

      .sound-btn {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--text-dim);
        padding: 0.5rem 1.1rem;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        backdrop-filter: blur(8px);
      }

      .sound-btn:hover {
        color: var(--text-main);
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      .sound-indicator {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #64748b;
      }

      .sound-btn.active .sound-indicator {
        background-color: var(--star-color);
        box-shadow: 0 0 8px var(--star-glow);
      }

      .hero-prologue {
        pointer-events: auto;
        display: inline-block;
        border: 0;
        background: transparent;
        font-family: inherit;
        color: var(--text-dim);
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        padding: 0.3rem 0.8rem;
      }

      .hero-prologue:hover {
        color: #ffffff;
        letter-spacing: 0.34em;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8),
          0 0 20px var(--star-glow);
      }

      .mirror-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 3;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .mirror-container.mesh-visible {
        opacity: 1;
      }

      svg.glass-svg {
        width: 100%;
        height: 100%;
      }

      .shard-polygon {
        fill: rgba(255, 255, 255, 0.015);
        stroke: var(--glass-line);
        stroke-width: 1.1px;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        vector-effect: non-scaling-stroke;
        filter: url(#crackWobble);
      }

      /* Unwitnessed shards stay faintly unsteady */
.shard-polygon {
  animation: shardUnrest var(--unrest-dur, 5s) ease-in-out
    var(--unrest-delay, 0s) infinite;
}

@keyframes shardUnrest {
  0%, 100% { stroke-opacity: 0.55; }
  40%      { stroke-opacity: 0.3; }
  55%      { stroke-opacity: 0.85; }
  70%      { stroke-opacity: 0.4; }
}

/* Witnessed: still, steady, brighter */
.shard-polygon.witnessed {
  animation: none;
  stroke: rgba(255, 255, 255, 0.65);
}

/* Hovering also calms the shard */
.shard-group:hover .shard-polygon {
  animation: none;
}

/* Gentle invitation on an unopened shard */
.shard-polygon.inviting {
  animation: shardInvite 3.5s ease-in-out 1;
}

@keyframes shardInvite {
  0%, 100% { fill: rgba(255, 255, 255, 0.015); stroke-opacity: 0.5; }
  50%      { fill: rgba(245, 158, 11, 0.14);   stroke-opacity: 1; }
}

      .shard-group:hover .shard-polygon {
        fill: var(--glass-glow);
        stroke: rgba(255, 255, 255, 0.9);
        filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.3));
      }

      .star-node {
        /* Hidden for now — a glowing point at every vertex reads as
         "constellation" rather than "screen breaking." The
         read/unread logic below still runs, it's just not
         rendered until/unless this is turned back on. */
        display: none;
      }

      /* A witnessed shard's interior brightens slightly — not
       "fixed," just no longer sitting in the dark unseen. */
      .shard-polygon.witnessed {
        fill: rgba(255, 255, 255, 0.055);
        transition: fill 1.6s ease;
      }

      /* Stars that are earned by being read, one shard at a time,
       until the whole mesh reads as a constellation. Persistent —
       these don't fade back out. */
      .corner-star {
        fill: #f8fafc;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.6s ease;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75));
      }

      .shard-label {
        font-size: 10px;
        fill: var(--text-dim);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        letter-spacing: 0.18em;
        pointer-events: none;
        text-transform: lowercase;
        text-anchor: middle;
        dominant-baseline: middle;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .shard-group:hover .shard-label {
        opacity: 1;
        fill: #ffffff;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 4, 7, 0.88);
        backdrop-filter: blur(14px);
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        padding: 2rem;
      }

      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-card {
        background: rgba(15, 15, 23, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
          0 0 30px rgba(245, 158, 11, 0.1);
        border-radius: 6px;
        max-width: 600px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 3rem;
        position: relative;
        transform: translateY(20px);
        transition: transform 0.4s ease;
      }

      .modal-overlay.open .modal-card {
        transform: translateY(0);
      }

      .modal-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: transparent;
        border: none;
        color: var(--text-dim);
        font-size: 1.25rem;
        cursor: pointer;
        transition: color 0.2s;
      }

      .modal-close:hover {
        color: var(--text-main);
      }

      .modal-tag {
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        color: var(--star-color);
        text-transform: uppercase;
        margin-bottom: 1rem;
      }

      .modal-title {
        font-family: Georgia, serif;
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 1.5rem;
        color: var(--text-main);
      }

      .modal-body {
  font-family: Georgia, serif;
  line-height: 1.8;
  color: #cbd5e1;
  font-size: 1rem;
  white-space: pre-wrap;
}

      /* Thin, dark scrollbar wherever long text scrolls — the
       default browser one looks out of place against this design. */
      .modal-card,
      .reading-body {
        scrollbar-width: thin;
        scrollbar-color: #0a0a0c transparent;
      }

      .modal-card::-webkit-scrollbar,
      .reading-body::-webkit-scrollbar {
        width: 4px;
      }

      .modal-card::-webkit-scrollbar-track,
      .reading-body::-webkit-scrollbar-track {
        background: transparent;
      }

      .modal-card::-webkit-scrollbar-thumb,
      .reading-body::-webkit-scrollbar-thumb {
        background-color: #0a0a0c;
        border-radius: 9999px;
      }

      .modal-card::-webkit-scrollbar-thumb:hover,
      .reading-body::-webkit-scrollbar-thumb:hover {
        background-color: #000000;
      }

      @media (max-width: 768px) {
        .modal-card {
          padding: 2rem;
        }
      }
      /* Prevents double-tap zoom and the grey tap flash on touch screens */
body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* On touch screens there's no hover, so the shard labels stay faintly visible */
@media (hover: none) {
  .shard-label { opacity: 0.3; }
}

.enter-btn.show { opacity: 1; transition: opacity 1.5s ease; }

.intro-para {
  margin-bottom: 1.3em;
  opacity: 0;
  transition: opacity 3.5s ease;
}
.intro-para.shown { opacity: 1; }

/* ===== The reading shard ===== */
.modal-overlay {
  background: rgba(4, 4, 7, 0.7);
  backdrop-filter: none;
  transition: opacity 0.8s ease;
}

.modal-card {
  position: relative;
  display: flex;
  width: min(860px, 92vw);
  min-height: min(58vh, 520px);
  max-height: none;
  padding: 0;
  overflow: visible;
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  pointer-events: none; /* only the shape itself catches taps */
  opacity: 0;
  transform: translate(var(--from-x, 0px), var(--from-y, 20px))
    scale(var(--from-s, 0.9));
  transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
}

.modal-overlay.open .modal-card {
  opacity: 1;
  transform: none;
}

.modal-shape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.18));
}

.modal-shape polygon {
  fill: rgba(12, 12, 20, 0.72);
  stroke: rgba(255, 255, 255, 0.7);
  stroke-width: 1.2px;
  vector-effect: non-scaling-stroke;
  stroke-linejoin: miter;
}

.modal-scroll {
  position: relative;
  flex: 1;
  max-height: 84vh;
  overflow-y: auto;
  padding: 3.4rem 4rem;
  pointer-events: auto;
}

@media (max-width: 768px) {
  .modal-scroll { padding: 2.8rem 2.2rem; }
}

.modal-close {
  position: absolute;
  top: 1.6rem;
  right: 2.2rem;
  z-index: 2;
  padding: 0.5rem;
  font-size: 1.5rem;
  color: var(--star-color);
  pointer-events: auto;
  filter: drop-shadow(0 0 6px var(--star-glow));
  transition: transform 0.3s ease, color 0.3s ease;
}

.modal-close:hover {
  color: #ffffff;
  transform: scale(1.25);
}

/* Poem lines appear one by one */
.modal-body .ln {
  opacity: 0;
  transition: opacity 1.4s ease;
}

.modal-body.lit .ln { opacity: 1; }

.modal-scroll {
  scrollbar-width: thin;
  scrollbar-color: #1a1a22 transparent;
}
.modal-scroll::-webkit-scrollbar { width: 4px; }
.modal-scroll::-webkit-scrollbar-thumb {
  background: #1a1a22;
  border-radius: 9999px;
}

.modal-scroll { padding: 3.8rem 4.6rem; }
.modal-close { top: 2.2rem; right: 3rem; }
@media (max-width: 768px) {
  .modal-scroll { padding: 3rem 2.4rem; }
}

.modal-close { top: 2.6rem; right: 3.8rem; }
.modal-overlay:not(.open) .modal-scroll,
.modal-overlay:not(.open) .modal-close {
  pointer-events: none;
}

.modal-title,
.modal-body {
  font-family: 'Caveat', 'Bradley Hand', cursive;
}
.modal-title { font-weight: 400; font-size: clamp(1.8rem, 2.6vw, 2.5rem); }
.modal-body {
  font-weight: 400;
  font-size: clamp(1.25rem, 1.6vw, 1.7rem);
  line-height: 1.5;
  color: rgba(203, 213, 225, 0.82);
}

/* each line is written left to right */
.modal-body .ln {
  display: block;
  width: fit-content;
  opacity: 1;
  clip-path: inset(-0.3em 100% -0.3em 0);
  transition: clip-path 1s ease-out;
}
.modal-body.lit .ln {
  clip-path: inset(-0.3em 0 -0.3em 0);
}

/* soft fade at the bottom while more of the poem is below */
.modal-scroll.more-below {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 4rem), transparent 100%);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 4rem), transparent 100%);
}

/* a scrollbar that can actually be seen */
.modal-scroll { scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }
.modal-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); }

.intro-para { opacity: 1; transition: none; }
.intro-para .w { opacity: 0; transition: opacity 0.9s ease; }
.reading-body.written .intro-para .w { opacity: 1; }

.shard-avatar { z-index: 45; pointer-events: auto; }
.shard-avatar::after { inset: -28px; }

.shard-avatar { display: none !important; }

/* phones: the real screen height, shard labels off, smaller header */
.mirror-container { height: 100dvh; }

@media (orientation: portrait) {
  .shard-label { display: none; }
}

@media (max-width: 768px) {
  header { padding: 1.2rem 1.2rem; gap: 0.8rem; }
  .shard-avatar { bottom: 1.6rem; left: 1.6rem; }
}

    </style>

  <body>
    <!-- ================================
       INTRO OVERLAY (new)
       ================================ -->
    <div class="intro-overlay" id="introOverlay">
      <div class="reading-screen" id="stageSoul">
        <button class="reading-title" id="introSoulBtn">SOUL</button>
      </div>

      <div class="reading-screen reading-hidden" id="stageIntro">
        <div class="reading-body" id="introBodyText"></div>
        <button class="enter-btn" id="introEnterBtn">Enter</button>
      </div>
    </div>

    <canvas id="dust-canvas"></canvas>
    <button
      class="shard-avatar reveal-target"
      id="shardAvatarBtn"
      aria-label="A soul of its own"
    ></button>

    <header class="reveal-target">
      <button class="hero-prologue" id="prologueBtn">Prologue</button>
      <button class="sound-btn" id="soundToggle">
        <span class="sound-indicator"></span>
        <span id="soundLabel">Soundscape Off</span>
      </button>
    </header>

    <div class="mirror-container">
      <svg
        class="glass-svg"
        viewBox="0 0 1600 900"
        preserveAspectRatio="xMidYMid slice"
      >
        <defs>
          <filter id="crackWobble" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.012 0.018"
              numOctaves="2"
              seed="7"
              result="noise"
            />
            <feDisplacementMap
              in="SourceGraphic"
              in2="noise"
              xChannelSelector="R"
              yChannelSelector="G"
              scale="10"
            >
              <animate
                id="crackWobbleAnim"
                attributeName="scale"
                from="10"
                to="0"
                dur="11s"
                begin="indefinite"
                fill="freeze"
              />
            </feDisplacementMap>
          </filter>
        </defs>
        <g id="meshGroup">

        <!-- SHARD 1 (Top Left Edge) -->
        <g class="shard-group" onclick="openShard(0)">
          <polygon class="shard-polygon" points="0,0 480,0 260,180 0,310" />
          <circle class="star-node" cx="260" cy="180" r="3.5" />
          <text x="180" y="110" class="shard-label">shard n°1</text>
        </g>

        <!-- SHARD 2 (Top Center-Left Edge) -->
        <g class="shard-group" onclick="openShard(1)">
          <polygon class="shard-polygon" points="480,0 920,0 710,130 260,180" />
          <circle class="star-node" cx="710" cy="130" r="4" />
          <text x="580" y="70" class="shard-label">shard n°2</text>
        </g>

        <!-- SHARD 3 (Top Right Edge) -->
        <g class="shard-group" onclick="openShard(2)">

// Builds an irregular, jagged shard outline. The same seed always gives
// the same shape, so a poem keeps its own shard every time.
function shardShapePoints(seedStr) {
  const r = seededRandom(seedStr);
  const C = 50;       // center of the shape (in %)
  const H = 42;       // half-size of the area kept free for the text
  const MIN = 1.08;   // never go below this, or the text could touch the edge
  const REACH = 0.4;  // how far points can stick out. Bigger = spikier, more broken

  const f = () => MIN + Math.pow(r(), 1.4) * REACH;
  const extras = () =>
    Array.from({ length: 1 + Math.floor(r() * 2) }, () => (r() * 2 - 1) * 0.85)
      .sort((a, b) => a - b);

  // walks around the text area: each corner and each side gets its own
  // irregular points, pushed outward by different amounts
  const pts = [];
  pts.push([C - H * f(), C - H * f()]);
  extras().forEach((x) => pts.push([C + x * H, C - H * f()]));
  pts.push([C + H * f(), C - H * f()]);
  extras().forEach((y) => pts.push([C + H * f(), C + y * H]));
  pts.push([C + H * f(), C + H * f()]);
  extras().reverse().forEach((x) => pts.push([C + x * H, C + H * f()]));
  pts.push([C - H * f(), C + H * f()]);
  extras().reverse().forEach((y) => pts.push([C - H * f(), C + y * H]));

  // small extra splinters along the edges
  const out = [];
  pts.forEach((p, i) => {
    out.push(p);
    const q = pts[(i + 1) % pts.length];
    if (r() < 0.6) {
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const dx = mx - C, dy = my - C, d = Math.hypot(dx, dy) || 1;
      const push = 0.6 + r() * 2;
      out.push([mx + (dx / d) * push, my + (dy / d) * push]);
    }
  });

  return out.map((p) => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
}

      // ================================
      // REAL FRACTURE GEOMETRY
      // Every polygon edge gets subdivided into a small jagged
      // zigzag instead of one straight line — actual broken-glass
      // geometry, not a filter faking it. Edges are shared between
      // neighboring shards, so the jitter for a given edge is cached
      // by its endpoint coordinates and reused identically by both
      // polygons that border it — otherwise the two sides wouldn't
      // line up and gaps would appear.
      // ================================

      function seededRandom(seedStr) {
        let h = 0;
        for (let i = 0; i < seedStr.length; i++) {
          h = (h * 31 + seedStr.charCodeAt(i)) >>> 0;
        }
        return function () {
          h = (h * 1664525 + 1013904223) >>> 0;
          return h / 4294967296;
        };

      const edgeJitterCache = new Map();

      function jitteredEdgePoints(x1, y1, x2, y2) {
        const a = `${x1},${y1}`;
        const b = `${x2},${y2}`;
        const canonicalStart = a < b ? a : b;
        const key = a < b ? `${a}|${b}` : `${b}|${a}`;

        if (!edgeJitterCache.has(key)) {
          const rand = seededRandom(key);
          const segments = 4;
          const dx = x2 - x1;
          const dy = y2 - y1;
          const dist = Math.hypot(dx, dy) || 1;
          const nx = -dy / dist;
          const ny = dx / dist;
          const maxJitter = Math.min(11, dist * 0.07);

          const pts = [];
          for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            let px = x1 + dx * t;
            let py = y1 + dy * t;
            if (i > 0 && i < segments) {
              const taper = Math.sin(t * Math.PI);
              const offset = (rand() - 0.5) * 2 * maxJitter * taper;
              px += nx * offset;
              py += ny * offset;
            }
            pts.push([px, py]);
          }
          // store in canonical (a-to-b) order regardless of which
          // direction this particular call came from
          edgeJitterCache.set(
            key,
            a === canonicalStart ? pts : pts.slice().reverse()
          );
        }

        const cached = edgeJitterCache.get(key);
        return a === canonicalStart ? cached : cached.slice().reverse();
      }

          poly.style.transition = 'none';
          poly.style.strokeDasharray = length;
          poly.style.strokeDashoffset = length;

      // READ / UNREAD NODE STATE
      // Persists across a visit via localStorage. Once every
      // shard has been read, the record is cleared — the next
      // visit begins the same way this one did: unread, unstable,
      // waiting to be found.
      // ================================

      const READ_STORAGE_KEY = 'shardsReadIndices';
      const allShardGroups = Array.from(
        document.querySelectorAll('.shard-group')
      );
      const totalReadableShards = SHARDS_DATA.length;

      function getReadIndices() {
        try {
          return new Set(
            JSON.parse(localStorage.getItem(READ_STORAGE_KEY) || '[]')
          );
        } catch (e) {
          return new Set();
        }
      }

      function saveReadIndices(set) {
  try {
    localStorage.setItem(READ_STORAGE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}

      const placedCornerStars = new Set();

      // Called both to restore already-witnessed shards on load, and
      // the moment a shard is newly read. The shard brightens
      // slightly, and a small star fades in — and stays — at each of
      // its true corners. Shared corners with a neighboring shard
      // only ever get one star, however many of the shards touching
      // that point end up witnessed.
      function witnessShard(index) {
        const group = allShardGroups[index];
        if (!group) return;

        const polygon = group.querySelector('.shard-polygon');
        if (polygon) polygon.classList.add('witnessed');

        const corners = shardCornerPoints[index] || [];
        const svg = document.getElementById('meshGroup');
        const ns = 'http://www.w3.org/2000/svg';

        corners.forEach(([x, y], i) => {
          const key = `${Math.round(x)},${Math.round(y)}`;
          if (placedCornerStars.has(key)) return;
          placedCornerStars.add(key);

          const star = document.createElementNS(ns, 'circle');
          star.setAttribute('cx', x);
          star.setAttribute('cy', y);
          star.setAttribute('r', 2.2);
          star.setAttribute('class', 'corner-star');
          svg.appendChild(star);

          setTimeout(() => {
            star.style.opacity = '1';
          }, 150 + i * 120 + Math.random() * 200);
        });
      }

      function applyNodeStates() {
        const readSet = getReadIndices();
        allShardGroups.forEach((group, index) => {
          const node = group.querySelector('.star-node');
          if (node) node.classList.add(readSet.has(index) ? 'read' : 'unread');
          if (readSet.has(index)) witnessShard(index);
        });
      }
      applyNodeStates();

      function markShardRead(index) {
        const readSet = getReadIndices();
        if (readSet.has(index)) return;
        readSet.add(index);
        saveReadIndices(readSet);

        const group = allShardGroups[index];
        const node = group && group.querySelector('.star-node');
        if (node) {
          node.classList.remove('unread');
          node.classList.add('read');
        }
        witnessShard(index);
        witnessSound();

        if (readSet.size >= totalReadableShards) {
          // Every shard witnessed. No celebration — just stillness,
          // then a small phrase, then it lets go.
          const witnessMessage = document.getElementById('witnessMessage');
          document
            .getElementById('shardAvatarBtn')
            .classList.add('all-witnessed');
          setTimeout(() => {
            witnessMessage.classList.add('visible');
          }, 2500);
          setTimeout(() => {
            witnessMessage.classList.remove('visible');
          }, 8500);
          setTimeout(() => {
  dotBtn.classList.add('final-call');
}, 9500);
          setTimeout(() => {
            try { localStorage.removeItem(READ_STORAGE_KEY); } catch (e) {}
          }, 12000);
        }
      }

      // Each shard trembles at its own rhythm, so they never pulse in sync
document.querySelectorAll('.shard-polygon').forEach((p) => {
  p.style.setProperty('--unrest-dur', 4 + Math.random() * 3 + 's');
  p.style.setProperty('--unrest-delay', -Math.random() * 6 + 's');
});

// If nobody touches the screen for a while, one unopened shard glows
let lastInteraction = Date.now();
['pointerdown', 'keydown'].forEach((ev) =>
  document.addEventListener(ev, () => {
    lastInteraction = Date.now();
  })
);

function inviteShard() {
  if (!introOverlay.classList.contains('intro-faded')) return;
  if (modal.classList.contains('open')) return;
  if (Date.now() - lastInteraction < 8000) return;

  const readSet = getReadIndices();
  const unread = allShardGroups
    .map((g, i) => i)
    .filter((i) => !readSet.has(i));
  if (!unread.length) return;

  const i = unread[Math.floor(Math.random() * unread.length)];
  const poly = allShardGroups[i].querySelector('.shard-polygon');
  poly.classList.add('inviting');
  setTimeout(() => poly.classList.remove('inviting'), 3500);
}
setInterval(inviteShard, 6000);

// ---- GALLERY SETTINGS ----
// 'reset'      = after a quiet period, the piece restarts from SOUL for the next visitor
// 'accumulate' = the constellation keeps growing across visitors
const GALLERY_MODE = 'reset';
const IDLE_RESET_MS = 3 * 60 * 1000; // 3 minutes
const DOT_CALLS_AFTER = 5; // shards read before the dot starts to pulse

let lastActivity = Date.now();
['pointerdown', 'pointermove', 'touchstart', 'wheel', 'keydown'].forEach((ev) =>
  document.addEventListener(ev, () => (lastActivity = Date.now()), { passive: true })
);
document.addEventListener('scroll', () => (lastActivity = Date.now()), true);

setInterval(() => {
  if (GALLERY_MODE !== 'reset') return;
  const introStarted = stageSoul.classList.contains('reading-hidden');
  if (!introStarted) return;
  if (Date.now() - lastActivity < IDLE_RESET_MS) return;
  try { localStorage.removeItem(READ_STORAGE_KEY); } catch (e) {}
  location.reload();
}, 5000);

// The dot starts calling after a few shards, until someone opens it
const dotBtn = document.getElementById('shardAvatarBtn');
let dotOpened = false;
dotBtn.addEventListener('click', () => {
  dotOpened = true;
  dotBtn.classList.remove('calling', 'final-call');
});
setInterval(() => {
  if (!dotOpened && getReadIndices().size >= DOT_CALLS_AFTER) {
    dotBtn.classList.add('calling');
  }
}, 2000);
// ================= SOUND (atmospheric) =================
let audioCtx = null, master = null, noiseGain = null, reverbIn = null;
let soundStarted = false, soundMuted = false;
const soundToggle = document.getElementById('soundToggle');
const soundLabel = document.getElementById('soundLabel');


// open, unresolved notes (G major pentatonic), low to high
const NOTES = [196, 220, 246.94, 293.66, 329.63, 392, 440, 493.88, 587.33, 659.25];

function startSound() {
  if (soundStarted) return;
  soundStarted = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const t = audioCtx.currentTime;

  // master volume, fading in slowly
  master = audioCtx.createGain();
  master.gain.setValueAtTime(0, t);
  master.gain.linearRampToValueAtTime(1, t + 6);
  master.connect(audioCtx.destination);

  // big, soft reverb so tones feel like they're in a large dark room
  const len = audioCtx.sampleRate * 5;
  const ir = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
  }
  const conv = audioCtx.createConvolver();
  conv.buffer = ir;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.7;
  reverbIn = audioCtx.createGain();
  reverbIn.connect(master); // dry
  reverbIn.connect(conv);
  conv.connect(wet);
  wet.connect(master);

  // low murmuring noise (the pain), recedes as shards are witnessed
  const size = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const out = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < size; i++) {
    const white = Math.random() * 2 - 1;
    out[i] = ((last + 0.02 * white) / 1.02) * 3.5;
    last = (last + 0.02 * white) / 1.02;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  noise.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 170;
  noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.08;
  noise.connect(lp);
  lp.connect(noiseGain);
  noiseGain.connect(master);
  noise.start();

  // deep hum that slowly breathes
  const humGain = audioCtx.createGain();
  humGain.gain.value = 0.03;
  [55, 55.4].forEach((f) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.connect(humGain);
    o.start();
  });
  humGain.connect(master);
  const lfo = audioCtx.createOscillator();
  const lfoDepth = audioCtx.createGain();
  lfo.frequency.value = 0.07;
  lfoDepth.gain.value = 0.012;
  lfo.connect(lfoDepth);
  lfoDepth.connect(humGain.gain);
  lfo.start();
}

function playTone(freq, vol, attack = 2.5, release = 7) {
  if (!soundStarted) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
  o.connect(g);
  g.connect(reverbIn);
  o.start(t);
  o.stop(t + attack + release + 0.1);
}

// quiet glass sound when a shard opens
function glassPing() {
  [2093, 3136].forEach((f, i) =>
    playTone(f * (1 + Math.random() * 0.01), 0.025 / (i + 1), 0.005, 1.8)
  );
}

// a soft star-tone when a shard is witnessed for the first time
function witnessSound() {
  playTone(NOTES[Math.floor(Math.random() * NOTES.length)], 0.04, 1.5, 8);
}

// every few seconds: the murmur recedes and star-tones appear
// more often as more of the sky has been witnessed
setInterval(() => {
  if (!soundStarted || soundMuted) return;
  const n = getReadIndices().size;
  const p = n / SHARDS_DATA.length;
  noiseGain.gain.setTargetAtTime(0.08 - 0.05 * p, audioCtx.currentTime, 4);
  if (n > 0 && Math.random() < 0.2 + 0.6 * p) {
    playTone(NOTES[Math.floor(Math.random() * NOTES.length)], 0.012 + 0.02 * p);
  }
}, 4000);

// start at the SOUL click (browsers only allow sound after a tap)
introSoulBtn.addEventListener('click', () => {
  startSound();
  soundToggle.classList.add('active');
  soundLabel.innerText = 'Sound On';
});

// the button is now just a mute switch
soundToggle.addEventListener('click', () => {
  if (!soundStarted) return;
  soundMuted = !soundMuted;
  master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.setTargetAtTime(soundMuted ? 0 : 1, audioCtx.currentTime, 0.4);
  soundToggle.classList.toggle('active', !soundMuted);
  soundLabel.innerText = soundMuted ? 'Sound Off' : 'Sound On';
});

// ===== soft cracking and shattering =====
function crackSound(vol = 0.03) {
  if (!soundStarted || soundMuted) return;
  const sr = audioCtx.sampleRate;
  const t0 = audioCtx.currentTime;
  const total = 1.5 + Math.random() * 2.5; // seconds the fracture takes to spread

  const pan = audioCtx.createStereoPanner();
  pan.pan.value = Math.random() * 2 - 1;
  pan.connect(reverbIn);

  // 1. The creak: glass under strain. A sparse train of tiny clicks,
  //    filtered so it groans, with the pitch slowly gliding upward.
  const clen = Math.floor(sr * total);
  const cbuf = audioCtx.createBuffer(1, clen, sr);
  const cd = cbuf.getChannelData(0);
  for (let k = 0; k < clen; k++) {
    cd[k] = Math.random() < 0.004 ? Math.random() * 2 - 1 : 0;
  }
  const csrc = audioCtx.createBufferSource();
  csrc.buffer = cbuf;
  const cbp = audioCtx.createBiquadFilter();
  cbp.type = 'bandpass';
  cbp.Q.value = 7;
  cbp.frequency.setValueAtTime(700 + Math.random() * 600, t0);
  cbp.frequency.exponentialRampToValueAtTime(1800 + Math.random() * 1800, t0 + total);
  const cg = audioCtx.createGain();
  cg.gain.setValueAtTime(0.0001, t0);
  cg.gain.linearRampToValueAtTime(vol * 1.6, t0 + total * 0.45);
  cg.gain.linearRampToValueAtTime(0.0001, t0 + total);
  csrc.connect(cbp);
  cbp.connect(cg);
  cg.connect(pan);
  csrc.start(t0);

  // 2. The fracture: small glassy ticks that ring briefly. They start
  //    close together and drift apart, like a crack losing energy.
  let t = 0.05 + Math.random() * 0.2;
  while (t < total) {
    const len = Math.floor(sr * 0.03);
    const buf = audioCtx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let k = 0; k < len; k++) {
      d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 18; // high Q makes it ring like glass
    bp.frequency.value = 3200 + Math.random() * 5000;
    const g = audioCtx.createGain();
    g.gain.value = vol * (0.6 + Math.random() * 0.8) * (1 - t / total);
    src.connect(bp);
    bp.connect(g);
    g.connect(pan);
    src.start(t0 + t);
    t += 0.05 + Math.pow(Math.random(), 2) * 0.4 * (1 + t);
  }
}

// every so often, a distant crack. Rarer as more shards are witnessed.
function scheduleAmbientCrack() {
  const unread = 1 - getReadIndices().size / SHARDS_DATA.length;
  const wait = 18000 + Math.random() * 30000 + (1 - unread) * 30000;
  setTimeout(() => {
    if (introOverlay.classList.contains('intro-faded') && !modal.classList.contains('open')) {
      crackSound(0.006 + 0.012 * unread);
    }
    scheduleAmbientCrack();
  }, wait);
}
scheduleAmbientCrack();

function closeModal() {
  modal.classList.remove('open');
  followTimers.forEach(clearTimeout);
}

modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});

document.querySelector('.modal-close').addEventListener('click', closeModal);

// ===== smooth, continuous follow-the-pen scrolling =====
let currentFollow = null;

function stopFollow() {
  if (currentFollow) {
    currentFollow.stopped = true;
    cancelAnimationFrame(currentFollow.raf);
    currentFollow = null;
  }
}

// items: [{ el, start, dur }] with times in seconds from now
function followWriting(container, items) {
  stopFollow();
  const state = { stopped: false, raf: 0 };
  currentFollow = state;

  // position of an element inside the scrolling box.
  // (offsetTop is not affected by the opening animation, so it stays accurate)
  const yIn = (el) =>
    el.offsetParent === container ? el.offsetTop : el.offsetTop - container.offsetTop;

  const START_AT = 0.6; // scrolling begins once the text fills 60% of the view
  const first = items.find(
    (it) => yIn(it.el) + it.el.offsetHeight > container.clientHeight * START_AT
  );
  if (!first) return; // short poem: everything fits, nothing to scroll

  const last = items[items.length - 1];
  const tStart = first.start;
  const tEnd = last.start + last.dur + 1;

  const t0 = performance.now();
  const tick = (now) => {
    if (state.stopped) return;
    const elapsed = (now - t0) / 1000;
    const maxScroll = container.scrollHeight - container.clientHeight;
    const p = Math.min(1, Math.max(0, (elapsed - tStart) / (tEnd - tStart)));
    container.scrollTop = maxScroll * p; // constant speed, whatever the text is doing
    if (p < 1) state.raf = requestAnimationFrame(tick);
  };
  state.raf = requestAnimationFrame(tick);
}

// if the visitor touches or scrolls, they take over
[readerScroll, introBodyText].forEach((c) =>
  ['wheel', 'touchstart', 'pointerdown'].forEach((ev) =>
    c.addEventListener(ev, stopFollow, { passive: true })
  )
);

// The dot opens "A Soul of Its Own" whenever a tap lands on or near it
document.addEventListener(
  'click',
  (e) => {
    const dot = document.getElementById('shardAvatarBtn');
    if (!dot || !dot.classList.contains('revealed')) return;
    const r = dot.getBoundingClientRect();
    const pad = 30; // forgiving area around the dot
    if (
      e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
      e.clientY >= r.top - pad && e.clientY <= r.bottom + pad
    ) {
      e.stopPropagation(); // so the shard underneath doesn't open too
      dot.classList.remove('calling', 'final-call');
      dotOpened = true;
      openReader({
        ...SHARDS_SECTION_DATA,
        from: dot,
        seed: 'soul',
      });
    }
  },
  true
);

// On tall (portrait) screens, rotate the whole mesh 90° so it fills the phone
function layoutMesh() {
  const svg = document.querySelector('.glass-svg');
  const g = document.getElementById('meshGroup');
  const portrait = window.innerHeight > window.innerWidth;
  if (portrait) {
    svg.setAttribute('viewBox', '0 0 900 1600');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    g.setAttribute('transform', 'translate(900,0) rotate(90)');
  } else {
    svg.setAttribute('viewBox', '0 0 1600 900');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    g.removeAttribute('transform');
  }
}
layoutMesh();
window.addEventListener('resize', layoutMesh);
